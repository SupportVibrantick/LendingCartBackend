name: Deploy LendingCart Project

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_database:
        description: "DANGER - wipe database and rebuild schema (manual only)"
        type: boolean
        default: false
      run_seed:
        description: "Run database seed after schema sync"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESET_DB: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reset_database == true && 'true' || 'false' }}
      RUN_SEED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seed == 'true' && 'true' || 'false' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
    env:
      RESET_DB: ${{ env.RESET_DB }}
      RUN_SEED: ${{ env.RUN_SEED }}
      VITE_API_BASE: https://api-lendingcart.vibrantick.org
      VITE_EMBED_APP_URL: https://embed-lendingcart.vibrantick.org
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_LENDINGCART }}
          port: ${{ secrets.SSH_PORT }}
          envs: RESET_DB,RUN_SEED,VITE_API_BASE,VITE_EMBED_APP_URL
          script: |
            set -euo pipefail

            echo "🚀 Starting LendingCart deployment..."
            echo "   reset_database=${RESET_DB}"
            echo "   run_seed=${RUN_SEED}"

            cd /root/LendingCartBackend || exit 1

            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            #################################################
            # Backend
            #################################################

            cd backend || exit 1

            echo "📦 Installing backend dependencies..."
            npm ci

            if [ "${RESET_DB}" = "true" ]; then
              echo "⚠️ Resetting database (ALL DATA WILL BE LOST)..."
              npx prisma migrate reset --force --skip-seed
            fi

            echo "🗄️ Deploying database (migrate + patches)..."
            npm run db:deploy

            echo "🔧 Generating Prisma client..."
            npx prisma generate

            if [ "${RUN_SEED}" = "true" ]; then
              echo "🌱 Running database seed..."
              npm run db:seed
            else
              echo "⏭️ Skipping database seed"
            fi

            echo "🔁 Restarting backend..."
            if pm2 list | grep -q "lendingcart-backend"; then
              pm2 restart lendingcart-backend
            else
              pm2 start bin/www --name lendingcart-backend
            fi

            pm2 save

            #################################################
            # Admin Dashboard
            #################################################

            cd ../admin-dashboard || exit 1

            echo "📦 Installing admin dashboard dependencies..."
            npm ci

            echo "🏗️ Building admin dashboard..."
            npm run build

            mkdir -p /var/www/admin
            rm -rf /var/www/admin/*
            cp -r dist/* /var/www/admin/

            #################################################
            # Broker Dashboard
            #################################################

            cd ../broker-dashboard || exit 1

            echo "📦 Installing broker dashboard dependencies..."
            npm ci

            echo "🏗️ Building broker dashboard..."
            npm run build

            mkdir -p /var/www/broker
            rm -rf /var/www/broker/*
            cp -r dist/* /var/www/broker/

            #################################################
            # Lending Dashboard
            #################################################

            cd ../lending-dashboard || exit 1

            echo "📦 Installing lending dashboard dependencies..."
            npm ci

            echo "🏗️ Building lending dashboard..."
            npm run build

            mkdir -p /var/www/lending
            rm -rf /var/www/lending/*
            cp -r dist/* /var/www/lending/

            #################################################
            # Loan AI
            #################################################

            cd ../loan-ai || exit 1

            echo "📦 Installing loan-ai dependencies..."
            npm ci

            echo "🏗️ Building loan-ai..."
            npm run build

            mkdir -p /var/www/loan-ai
            rm -rf /var/www/loan-ai/*
            cp -r dist/* /var/www/loan-ai/

            #################################################
            # Loan Application Embedded
            #################################################

            cd ../loan-application-embeded || exit 1

            echo "📦 Installing loan application embedded dependencies..."
            npm ci

            echo "🏗️ Building loan application embedded..."
            npm run build

            mkdir -p /var/www/embed
            rm -rf /var/www/embed/*
            cp -r dist/* /var/www/embed/

            #################################################
            # Nginx
            #################################################

            systemctl restart nginx

            echo "🎉 Deployment completed successfully!"
