name: Deploy LendingCart Project

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_database:
        description: "DANGER - wipe database and rebuild schema (manual only)"
        type: boolean
        default: false
      run_seed:
        description: "Run database seed after schema sync"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESET_DB: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reset_database == true && 'true' || 'false' }}
      RUN_SEED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seed == false && 'false' || 'true' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      #############################################
      # NETWORK DEBUGGING (KEEP COMMENTED)
      #############################################
      # 

      # - name: Test SSH Login
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_KEY_LENDINGCART }}
      #     port: ${{ secrets.SSH_PORT }}
      #     script: |
      #       echo "SSH Connection Successful"
      #       whoami
      #       hostname
      #       pwd

      # - name: Test Connectivity
      #   run: |
      #       ping -c 4 ${{ secrets.SSH_HOST }} || true

      # - name: Install Tools
      #   run: |
      #       sudo apt-get update
      #       sudo apt-get install -y netcat-openbsd traceroute

      # - name: Traceroute
      #   run: |
      #       traceroute -n ${{ secrets.SSH_HOST }} || true

      # - name: Test SSH Port
      #   run: |
      #       nc -vz -w 10 ${{ secrets.SSH_HOST }} ${{ secrets.SSH_PORT }}

      #############################################
      # Upload Backend
      #############################################
      - name: Upload Backend to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_LENDINGCART }}
          port: ${{ secrets.SSH_PORT }}
          source: "backend"
          target: ${{ secrets.PROJECT_PATH }}

      #############################################
      # Upload Admin Dashboard
      #############################################
      - name: Upload Admin Dashboard to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }} 
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_LENDINGCART }}
          port: ${{ secrets.SSH_PORT }}
          source: "admin-dashboard"
          target: ${{ secrets.PROJECT_PATH }}

      #############################################
      # Upload Broker Dashboard
      #############################################
      - name: Upload Broker Dashboard to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_LENDINGCART }}
          port: ${{ secrets.SSH_PORT }}
          source: "broker-dashboard"
          target: ${{ secrets.PROJECT_PATH }}

      #############################################
      # Upload Lending Dashboard
      #############################################
      - name: Upload Lending Dashboard to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_LENDINGCART }}
          port: ${{ secrets.SSH_PORT }}
          source: "lending-dashboard"
          target: ${{ secrets.PROJECT_PATH }}

      #############################################
      # Upload Loan AI
      #############################################
      - name: Upload Loan AI to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_LENDINGCART }}
          port: ${{ secrets.SSH_PORT }}
          source: "loan-ai"
          target: ${{ secrets.PROJECT_PATH }}

      #############################################
      # Upload Loan Application Embed
      #############################################
      - name: Upload Loan Application Embed to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_LENDINGCART }}
          port: ${{ secrets.SSH_PORT }}
          source: "loan-application-embeded"
          target: ${{ secrets.PROJECT_PATH }}

      #############################################
      # SSH Deployment Script
      #############################################
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          RESET_DB: ${{ env.RESET_DB }}
          RUN_SEED: ${{ env.RUN_SEED }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_LENDINGCART }}
          port: ${{ secrets.SSH_PORT }}
          envs: RESET_DB,RUN_SEED
          script: |
            set -euo pipefail

            echo "🚀 Starting LendingCart deployment..."
            echo "   reset_database=${RESET_DB}"
            echo "   run_seed=${RUN_SEED}"

            #################################################
            # Backend (Node.js + Fastify + Prisma)
            #################################################
            cd /root/LendingCartBackend/backend || exit 1

            echo "📦 Installing backend dependencies..."
            npm ci

            if [ "${RESET_DB}" = "true" ]; then
              echo "⚠️ Resetting database (ALL DATA WILL BE LOST)..."
              if [ -d prisma/migrations ] && [ "$(ls -A prisma/migrations 2>/dev/null)" ]; then
                npx prisma migrate reset --force --skip-seed
              else
                npx prisma db push --force-reset --accept-data-loss
              fi
            fi

            echo "🔧 Generating Prisma client..."
            npx prisma generate

            echo "🗄️ Syncing database schema..."
            if [ -d prisma/migrations ] && [ "$(ls -A prisma/migrations 2>/dev/null)" ]; then
              npx prisma migrate deploy
            else
              echo "ℹ️ No prisma/migrations found — using prisma db push"
              npx prisma db push
            fi

            if [ "${RUN_SEED}" = "true" ]; then
              echo "🌱 Running database seed..."
              npm run db:seed
            else
              echo "⏭️ Skipping database seed (run_seed=false)"
            fi

            echo "🔁 Restarting PM2 backend..."
            if pm2 list | grep -q "lendingcart-backend"; then
              echo "Restarting PM2 process..."
              pm2 restart lendingcart-backend
            else
              echo "🚀 Starting new PM2 process..."
              pm2 start bin/www --name lendingcart-backend
            fi

            #################################################
            # Kafka Email Consumer (optional — uncomment in app.js first)
            #################################################
            # echo "📨 Starting or restarting Kafka email consumer..."
            # if pm2 list | grep -q "lendingcart-email-consumer"; then
            #   pm2 restart lendingcart-email-consumer
            # else
            #   pm2 start services/kafka/email/consumer.js --name lendingcart-email-consumer
            # fi

            pm2 save

            #################################################
            # Admin Dashboard (React + Vite)
            #################################################
            cd /root/LendingCartBackend/admin-dashboard || exit 1

            echo "📦 Installing admin dashboard dependencies..."
            npm ci

            echo "🏗️ Building admin dashboard..."
            npm run build

            echo "🚚 Deploying admin dashboard to Nginx..."
            mkdir -p /var/www/admin
            rm -rf /var/www/admin/*
            cp -r dist/* /var/www/admin/

            #################################################
            # Broker Dashboard (React + Vite) 
            #################################################
            cd /root/LendingCartBackend/broker-dashboard || exit 1

            echo "📦 Installing broker dashboard dependencies..."
            npm ci

            echo "🏗️ Building broker dashboard..."
            npm run build

            echo "🚚 Deploying broker dashboard to Nginx..."
            mkdir -p /var/www/broker
            rm -rf /var/www/broker/*
            cp -r dist/* /var/www/broker/

            #################################################
            # Lending Dashboard (React + Vite)
            #################################################
            cd /root/LendingCartBackend/lending-dashboard || exit 1

            echo "📦 Installing lending dashboard dependencies..."
            npm ci

            echo "🏗️ Building lending dashboard..."
            npm run build

            echo "🚚 Deploying lending dashboard to Nginx..."
            mkdir -p /var/www/lending
            rm -rf /var/www/lending/*
            cp -r dist/* /var/www/lending/

            #################################################
            # Loan AI (React + Vite)
            #################################################
            cd /root/LendingCartBackend/loan-ai || exit 1

            echo "📦 Installing loan-ai dependencies..."
            npm ci

            echo "🏗️ Building loan-ai..."
            npm run build

            echo "🚚 Deploying loan-ai to Nginx..."
            mkdir -p /var/www/loan-ai
            rm -rf /var/www/loan-ai/*
            cp -r dist/* /var/www/loan-ai/

            #################################################
            # Loan Application Embed (React + Vite)
            #################################################
            cd /root/LendingCartBackend/loan-application-embeded || exit 1

            echo "📦 Installing loan application embed dependencies..."
            npm ci

            echo "🏗️ Building loan application embed..."
            npm run build

            echo "🚚 Deploying loan application embed to Nginx..."
            mkdir -p /var/www/embed
            rm -rf /var/www/embed/*
            cp -r dist/* /var/www/embed/

            echo "🔄 Restarting Nginx..."
            systemctl restart nginx

            echo "🎉 LendingCart deployment finished successfully!"
