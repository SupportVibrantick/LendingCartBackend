name: Deploy LendingCart Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_LENDINGCART }}
          port: ${{ secrets.SSH_PORT }}

          script: |
            set -euo pipefail

            echo "🚀 Starting LendingCart deployment..."

            cd /root/LendingCartBackend

            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            #################################################
            # Backend
            #################################################

            cd backend

            echo "📦 Installing backend dependencies..."
            npm ci

            echo "🗄️ Running Prisma migrations..."
            npx prisma migrate deploy

            echo "🔧 Generating Prisma client..."
            npx prisma generate

            echo "📄 Seeding product document requirements..."
            node prisma/admin/productDocuments.seed.js

            #################################################
            # Admin Dashboard
            #################################################

            cd ../admin-dashboard

            npm ci
            npm run build

            mkdir -p /var/www/admin
            rm -rf /var/www/admin/*
            cp -r dist/* /var/www/admin/

            #################################################
            # Broker Dashboard
            #################################################

            cd ../broker-dashboard

            npm ci
            npm run build

            mkdir -p /var/www/broker
            rm -rf /var/www/broker/*
            cp -r dist/* /var/www/broker/

            #################################################
            # Lending Dashboard
            #################################################

            cd ../lending-dashboard

            npm ci
            npm run build

            mkdir -p /var/www/lending
            rm -rf /var/www/lending/*
            cp -r dist/* /var/www/lending/

            #################################################
            # Loan AI
            #################################################

            cd ../loan-ai

            npm ci
            npm run build

            mkdir -p /var/www/loan-ai
            rm -rf /var/www/loan-ai/*
            cp -r dist/* /var/www/loan-ai/

            #################################################
            # Loan Application Embedded
            #################################################

            cd ../loan-application-embeded

            npm ci
            npm run build

            mkdir -p /var/www/embed
            rm -rf /var/www/embed/*
            cp -r dist/* /var/www/embed/

            #################################################
            # Restart Nginx
            #################################################

            echo "🔄 Restarting Nginx..."
            systemctl restart nginx

            #################################################
            # Restart Backend
            #################################################

            cd /root/LendingCartBackend/backend

            echo "🔧 Regenerating Prisma client before restart..."
            npx prisma generate

            echo "✅ Verifying Prisma client..."
            node -e '
              const { LoanProductCode, $Enums } = require("@prisma/client");
              const codes = LoanProductCode || $Enums.LoanProductCode;
              if (!codes) {
                console.error("LoanProductCode missing from @prisma/client");
                process.exit(1);
              }
              console.log("LoanProductCode OK:", Object.keys(codes).length, "values");
            '

            if pm2 describe lendingcart-backend >/dev/null 2>&1; then
              echo "♻️ Restarting lendingcart-backend..."
              pm2 restart lendingcart-backend --update-env
            else
              echo "🚀 Starting lendingcart-backend..."
              pm2 start ecosystem.config.cjs --only lendingcart-backend
            fi

            #################################################
            # Restart Worker
            #################################################

            if pm2 describe lendingcart-worker >/dev/null 2>&1; then
              echo "♻️ Restarting lendingcart-worker..."
              pm2 restart lendingcart-worker --update-env
            else
              echo "🚀 Starting lendingcart-worker..."
              pm2 start ecosystem.config.cjs --only lendingcart-worker
            fi

            pm2 save

            APP_PORT="$(sed -n 's/^PORT=//p' .env 2>/dev/null | tail -1 | tr -d ' \"' || true)"
            APP_PORT="${APP_PORT:-3008}"

            echo "🏥 Waiting for backend on port ${APP_PORT}..."
            HEALTH_OK=0
            for attempt in $(seq 1 15); do
              if curl -sf "http://127.0.0.1:${APP_PORT}/" >/dev/null; then
                echo "✅ Backend healthy (attempt ${attempt})"
                HEALTH_OK=1
                break
              fi
              echo "… not ready yet (attempt ${attempt}/15)"
              sleep 4
            done

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "❌ Backend failed to start"
              pm2 logs lendingcart-backend --lines 80 --nostream
              exit 1
            fi

            echo "🎉 Deployment completed successfully!"