name: Deploy LendingCart Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_LENDINGCART }}
          port: ${{ secrets.SSH_PORT }}

          script: |
            set -euo pipefail

            echo "🚀 Starting LendingCart deployment..."

            cd /root/LendingCartBackend

            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            #################################################
            # Backend
            #################################################

            cd backend

            echo "📦 Installing backend dependencies..."
            npm ci

            echo "🧹 Stripping UTF-8 BOM from Prisma migration SQL files..."
            node <<'NODE'
            const fs = require("fs");
            const path = require("path");
            const root = path.join(process.cwd(), "prisma", "migrations");
            if (!fs.existsSync(root)) process.exit(0);
            let stripped = 0;
            for (const dir of fs.readdirSync(root)) {
              const file = path.join(root, dir, "migration.sql");
              if (!fs.existsSync(file)) continue;
              const buf = fs.readFileSync(file);
              if (
                buf.length >= 3 &&
                buf[0] === 0xef &&
                buf[1] === 0xbb &&
                buf[2] === 0xbf
              ) {
                fs.writeFileSync(file, buf.subarray(3));
                stripped += 1;
                console.log(`stripped BOM: ${path.join(dir, "migration.sql")}`);
              }
            }
            console.log(`BOM cleanup done (${stripped} file(s) fixed)`);
            NODE

            echo "🛠️ Recovering previously failed Prisma migrations (if any)..."
            node <<'NODE'
            require("dotenv").config();
            const { spawnSync } = require("child_process");
            const { PrismaClient } = require("@prisma/client");

            (async () => {
              const prisma = new PrismaClient();
              try {
                const failed = await prisma.$queryRawUnsafe(`
                  SELECT migration_name
                  FROM "_prisma_migrations"
                  WHERE finished_at IS NULL
                    AND rolled_back_at IS NULL
                    AND started_at IS NOT NULL
                  ORDER BY started_at ASC
                `);

                if (!failed.length) {
                  console.log("No failed migrations to recover");
                  return;
                }

                for (const row of failed) {
                  const name = row.migration_name;
                  console.log(`Marking failed migration as rolled back: ${name}`);
                  const result = spawnSync(
                    "npx",
                    ["prisma", "migrate", "resolve", "--rolled-back", name],
                    { stdio: "inherit", shell: true },
                  );
                  if (result.status !== 0) {
                    throw new Error(
                      `Failed to resolve rolled-back migration: ${name}`,
                    );
                  }
                }
              } finally {
                await prisma.$disconnect();
              }
            })().catch((err) => {
              console.error(err);
              process.exit(1);
            });
            NODE

            echo "🗄️ Running Prisma migrations..."
            npx prisma migrate deploy

            echo "🔧 Generating Prisma client..."
            npx prisma generate

            #################################################
            # Admin Dashboard
            #################################################

            cd ../admin-dashboard

            npm ci
            npm run build

            mkdir -p /var/www/admin
            rm -rf /var/www/admin/*
            cp -r dist/* /var/www/admin/

            #################################################
            # Broker Dashboard
            #################################################

            cd ../broker-dashboard

            npm ci
            npm run build

            mkdir -p /var/www/broker
            rm -rf /var/www/broker/*
            cp -r dist/* /var/www/broker/

            #################################################
            # Lending Dashboard
            #################################################

            cd ../lending-dashboard

            npm ci
            npm run build

            mkdir -p /var/www/lending
            rm -rf /var/www/lending/*
            cp -r dist/* /var/www/lending/

            #################################################
            # Loan AI
            #################################################

            cd ../loan-ai

            npm ci
            npm run build

            mkdir -p /var/www/loan-ai
            rm -rf /var/www/loan-ai/*
            cp -r dist/* /var/www/loan-ai/

            #################################################
            # Loan Application Embedded
            #################################################

            cd ../loan-application-embeded

            npm ci
            npm run build

            mkdir -p /var/www/embed
            rm -rf /var/www/embed/*
            cp -r dist/* /var/www/embed/

            #################################################
            # Restart Nginx
            #################################################

            echo "🔄 Restarting Nginx..."
            systemctl restart nginx

            #################################################
            # Restart Backend
            #################################################

            cd /root/LendingCartBackend/backend

            if pm2 describe lendingcart-backend >/dev/null 2>&1; then
              echo "♻️ Restarting lendingcart-backend..."
              pm2 restart lendingcart-backend --update-env
            else
              echo "🚀 Starting lendingcart-backend..."
              pm2 start ecosystem.config.cjs --only lendingcart-backend
            fi

            #################################################
            # Restart Worker
            #################################################

            if pm2 describe lendingcart-worker >/dev/null 2>&1; then
              echo "♻️ Restarting lendingcart-worker..."
              pm2 restart lendingcart-worker --update-env
            else
              echo "🚀 Starting lendingcart-worker..."
              pm2 start ecosystem.config.cjs --only lendingcart-worker
            fi

            pm2 save

            sleep 5

            if ! curl -sf http://127.0.0.1:3008/ >/dev/null; then
              echo "❌ Backend failed to start"
              pm2 logs lendingcart-backend --lines 50 --nostream
              exit 1
            fi

            echo "🎉 Deployment completed successfully!"
