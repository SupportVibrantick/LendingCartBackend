name: Deploy LendingCart to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lendingcart-aws-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_DEPLOY_HOST }}
          username: ${{ secrets.AWS_DEPLOY_USER }}
          key: ${{ secrets.AWS_DEPLOY_SSH_KEY }}
          port: ${{ secrets.AWS_DEPLOY_PORT }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.AWS_DEPLOY_PATH }}"

            export NVM_DIR="/home/ubuntu/.nvm"

            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "NVM is not installed for $USER"
              exit 1
            fi

            . "$NVM_DIR/nvm.sh"
            nvm use --silent 22


            echo "Starting LendingCart AWS deployment..."
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            echo "Installing backend dependencies and applying migrations..."
            cd backend
            npm ci
            npx prisma generate
            npx prisma migrate deploy

            echo "Building Admin Dashboard..."
            cd ../admin-dashboard
            npm ci
            npm run build
            sudo install -d -o ubuntu -g ubuntu /var/www/admin
            sudo cp -a dist/. /var/www/admin/

            echo "Building Broker Dashboard..."
            cd ../broker-dashboard
            npm ci
            npm run build
            sudo install -d -o ubuntu -g ubuntu /var/www/broker
            sudo cp -a dist/. /var/www/broker/

            echo "Building Lender Dashboard..."
            cd ../lending-dashboard
            npm ci
            npm run build
            sudo install -d -o ubuntu -g ubuntu /var/www/lender
            sudo cp -a dist/. /var/www/lender/

            echo "Building Landing Page..."
            cd ../loan-ai
            npm ci
            npm run build
            sudo install -d -o ubuntu -g ubuntu /var/www/loan-ai
            sudo cp -a dist/. /var/www/loan-ai/

            echo "Building Loan Application..."
            cd ../loan-application-embeded
            npm ci
            npm run build
            sudo install -d -o ubuntu -g ubuntu /var/www/app
            sudo cp -a dist/. /var/www/app/

            echo "Validating and reloading Nginx..."
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Starting application processes..."
            cd "$APP_DIR/backend"
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save

            sleep 5
            curl -fsS http://127.0.0.1:3002/ >/dev/null

            echo "Deployment completed successfully."
