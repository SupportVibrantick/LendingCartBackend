<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verify your email</title>
</head>
<body style="margin:0;padding:0;background:#f4f6fb;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fb;padding:40px 0;">
<tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;">
<tr>
<td style="background:#004aad;padding:28px;text-align:center;">
<img src="{{logoUrl}}" width="140" style="display:block;margin:auto;max-width:140px;" />
</td>
</tr>
<tr>
<td style="padding:30px 40px;color:#333;font-size:16px;line-height:1.6;">
<p>Dear <strong>{{name}}</strong>,</p>
<p>Thanks for joining LendingCart as a lender. Please verify your email address to unlock full platform access.</p>
<p style="text-align:center;margin:28px 0;">
<a href="{{verifyUrl}}" style="background:#004aad;color:#fff;text-decoration:none;padding:14px 28px;border-radius:6px;display:inline-block;font-weight:bold;">
Verify Email
</a>
</p>
<p style="font-size:13px;color:#777;">If the button does not work, copy this link:<br>{{verifyUrl}}</p>
</td>
</tr>
<tr>
<td style="padding:20px 40px;text-align:center;font-size:12px;color:#888;border-top:1px solid #eee;">
© {{currentYear}} LendingCart
</td>
</tr>
</table>
</td></tr>
</table>
</body>
</html>
