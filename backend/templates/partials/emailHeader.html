<tr>
  <td style="background:#ffffff;padding:24px 30px;text-align:center;border-bottom:1px solid #eef2f7;">
    {{#if logoUrl}}
    <img
      src="{{logoUrl}}"
      alt="{{brandName}} logo"
      width="180"
      style="display:block;margin:0 auto 10px auto;max-width:180px;max-height:80px;height:auto;object-fit:contain;"
    />
    {{/if}}
    <div style="color:#0f172a;font-size:20px;font-weight:700;">
      {{default emailTitle brandName}}
    </div>
    {{#if brandName}}
    <div style="color:#64748b;font-size:13px;margin-top:6px;">
      {{brandName}}
    </div>
    {{/if}}
  </td>
</tr>
