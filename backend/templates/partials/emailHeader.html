<tr>
  <td style="background:#004aad;padding:24px 30px;text-align:center;">
    {{#if logoUrl}}
    <img
      src="{{logoUrl}}"
      alt="{{brandName}} logo"
      width="180"
      style="display:block;margin:0 auto 10px auto;max-width:180px;max-height:80px;height:auto;object-fit:contain;"
    />
    {{/if}}
    <div style="color:#ffffff;font-size:20px;font-weight:700;">
      {{default emailTitle brandName}}
    </div>
    {{#if brandName}}
    <div style="color:#dbeafe;font-size:13px;margin-top:6px;">
      {{brandName}}
    </div>
    {{/if}}
  </td>
</tr>
